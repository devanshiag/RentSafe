{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Maintenance Request</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <input type="text" id="category" class="form-control" value="{{ request.category }}" disabled>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" class="form-control" rows="3" disabled>{{ request.description }}</textarea>
        </div>
        <div class="mb-3">
            <label for="severity" class="form-label">Severity</label>
            <input type="text" id="severity" class="form-control" value="{{ request.severity }}" disabled>
        </div>
        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="status" class="form-select">
                <option value="Open" {% if request.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="In Progress" {% if request.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                <option value="Deferred" {% if request.status == 'Deferred' %}selected{% endif %}>Deferred</option>
                <option value="Closed" {% if request.status == 'Closed' %}selected{% endif %}>Closed</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="admin_comments" class="form-label">Admin Comments</label>
            <textarea id="admin_comments" name="admin_comments" class="form-control" rows="3">{{ request.admin_comments }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{{ url_for('admin.admin_requests') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
